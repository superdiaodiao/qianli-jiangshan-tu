<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>千里江山图</title>
<style>
:root{
  --ink-900:#0b0f13; --ink-800:#121820; --ink-700:#1a222c; --ink-600:#242f3b;
  --line:#2c3844; --line-soft:#1f2933;
  --paper:#e7dcc4; --paper-2:#a9b0b4; --paper-3:#6f7a82;
  --silk:#c9a969; --azurite:#5a92cc; --malachite:#74a585; --cinnabar:#bb4032;
  --serif:"Noto Serif SC","Songti SC","STSong",SimSun,serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--ink-900);color:var(--paper);font-family:var(--sans);font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--azurite);outline-offset:2px}

#app{display:grid;grid-template-rows:1fr auto;height:100%;width:100%}

/* ---------- 画面 ---------- */
#viewport{position:relative;overflow:hidden;isolation:isolate;background:#6f6444;cursor:grab;touch-action:none}
#viewport.dragging{cursor:grabbing}
#plateWrap{position:absolute;inset:0;overflow:hidden;filter:saturate(1) brightness(1)}
#plate{position:absolute;inset:0;background:#8d7d55}
#baseLayer{position:absolute;inset:0;background-image:url(base.jpg);background-repeat:no-repeat;opacity:0;transition:opacity .5s ease;will-change:background-position}
#baseLayer.on{opacity:1}
#plate img{position:absolute;top:0;left:0;display:block;max-width:none;max-height:none;image-rendering:auto;opacity:0;transition:opacity .45s ease}
#plate img.on{opacity:1}
#gradeMul,#gradeScr{position:absolute;inset:0;pointer-events:none}
#gradeMul{mix-blend-mode:multiply}
#gradeScr{mix-blend-mode:screen}
#fx{position:absolute;inset:0;pointer-events:none}
#poiLayer{position:absolute;inset:0;pointer-events:none}

.poi{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:auto;cursor:pointer;display:grid;place-items:center}
.poi i{display:block;width:9px;height:9px;border-radius:50%;background:var(--cinnabar);box-shadow:0 0 0 1px rgba(255,235,200,.55),0 0 12px 2px rgba(187,64,50,.5);transition:transform .2s ease}
.poi::after{content:"";position:absolute;width:26px;height:26px;border:1px solid rgba(187,64,50,.55);border-radius:50%;opacity:0;transform:scale(.6);transition:opacity .25s,transform .25s}
.poi[hidden]{display:none}
.poi:hover i,.poi:focus-visible i,.poi.active i{transform:scale(1.45)}
.poi:hover::after,.poi:focus-visible::after,.poi.active::after{opacity:1;transform:scale(1)}

/* ---------- 卷首题签 ---------- */
#intro{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  background:radial-gradient(ellipse 78% 96% at 50% 50%,rgba(6,9,12,.20),rgba(6,9,12,.62));
  transition:opacity .9s ease;z-index:5}
#intro.gone{opacity:0}
.introBox{display:flex;align-items:flex-start;gap:22px;pointer-events:auto;padding:0 16px}
.vtitle{writing-mode:vertical-rl;font-family:var(--serif);font-weight:500;font-size:clamp(34px,6.2vh,58px);
  letter-spacing:.24em;color:var(--paper);text-shadow:0 2px 24px rgba(0,0,0,.65)}
.vmeta{writing-mode:vertical-rl;font-family:var(--serif);font-weight:300;font-size:13px;line-height:1.9;
  letter-spacing:.2em;color:var(--paper-2);max-height:min(46vh,340px);text-shadow:0 2px 14px rgba(0,0,0,.6)}
.seal{writing-mode:horizontal-tb;align-self:flex-end;margin-top:14px;font-family:var(--serif);font-size:11px;
  letter-spacing:.18em;color:#e8cfc2;background:var(--cinnabar);padding:5px 6px;line-height:1.35;text-align:center;
  box-shadow:0 2px 14px rgba(0,0,0,.5)}
#openBtn{writing-mode:vertical-rl;font-family:var(--serif);font-size:15px;letter-spacing:.34em;color:var(--paper);
  border:1px solid rgba(231,220,196,.38);padding:16px 9px;transition:background .25s,border-color .25s}
#openBtn:hover{background:rgba(231,220,196,.1);border-color:rgba(231,220,196,.7)}

/* ---------- 控制台 ---------- */
#console{background:linear-gradient(180deg,var(--ink-800),var(--ink-900));border-top:1px solid var(--line-soft);
  display:grid;gap:0;padding-bottom:env(safe-area-inset-bottom,0px)}
#console.hidden .cRow{display:none}

.guide{display:flex;gap:6px;overflow-x:auto;padding:9px 14px;border-bottom:1px solid var(--line-soft);scrollbar-width:thin}
.guide::-webkit-scrollbar{height:4px}
.guide::-webkit-scrollbar-thumb{background:var(--line)}
.chip{flex:0 0 auto;font-family:var(--serif);font-size:12.5px;letter-spacing:.12em;color:var(--paper-2);
  border:1px solid var(--line);padding:5px 11px;transition:color .2s,border-color .2s,background .2s;white-space:nowrap}
.chip:hover,.chip.on{color:var(--paper);border-color:var(--silk);background:rgba(201,169,105,.09)}
.guideLabel{flex:0 0 auto;font-family:var(--serif);font-size:11px;letter-spacing:.3em;color:var(--paper-3);
  align-self:center;padding-right:4px}

.cRow{display:grid;grid-template-columns:minmax(200px,268px) 1fr auto;gap:18px;align-items:center;padding:11px 14px}

.todBlock{display:flex;align-items:center;gap:11px}
.todName{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:.1em;width:1.3em;text-align:center;color:var(--silk)}
.todWrap{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.todScale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--paper-3)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:none;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
input[type=range]::-moz-range-track{height:1px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:var(--cinnabar);margin-top:-5px;box-shadow:0 0 0 1px rgba(231,220,196,.45)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--cinnabar);
  box-shadow:0 0 0 1px rgba(231,220,196,.45)}

.mapWrap{position:relative;height:44px;min-width:0;border:1px solid var(--line-soft);cursor:pointer;overflow:hidden;background:#6f6444}
.mapWrap img{width:100%;max-width:100%;height:100%;object-fit:fill;display:block;opacity:.62}
.mapBox{position:absolute;top:0;height:100%;border:1px solid var(--silk);background:rgba(201,169,105,.16);pointer-events:none;min-width:2px}
.mapTick{position:absolute;top:0;width:1px;height:6px;background:var(--cinnabar);pointer-events:none}
.mapTick.b{top:auto;bottom:0}

.btns{display:flex;gap:7px;align-items:center}
.btn{font-family:var(--serif);font-size:12.5px;letter-spacing:.14em;color:var(--paper-2);border:1px solid var(--line);
  padding:7px 12px;transition:color .2s,border-color .2s,background .2s;white-space:nowrap}
.btn:hover{color:var(--paper);border-color:var(--paper-3)}
.btn.on{color:var(--ink-900);background:var(--silk);border-color:var(--silk)}

/* ---------- 释文卡 ---------- */
#card{position:absolute;left:14px;bottom:14px;width:min(330px,calc(100% - 28px));background:rgba(10,14,18,.93);
  border:1px solid var(--line);border-left:2px solid var(--cinnabar);padding:15px 16px 16px;z-index:6;
  backdrop-filter:blur(6px);transform:translateY(8px);opacity:0;transition:opacity .28s,transform .28s;pointer-events:none}
#card.on{opacity:1;transform:none;pointer-events:auto}
#card h2{margin:0 0 7px;font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:.11em;color:var(--paper)}
#card p{margin:0;font-size:12.5px;line-height:1.95;color:var(--paper-2);letter-spacing:.03em}
#card .close{position:absolute;top:9px;right:11px;font-size:16px;line-height:1;color:var(--paper-3)}
#card .close:hover{color:var(--paper)}

#hint{position:absolute;top:14px;right:16px;font-family:var(--serif);font-size:11px;letter-spacing:.24em;
  color:rgba(231,220,196,.5);z-index:4;transition:opacity .6s;text-shadow:0 1px 8px rgba(0,0,0,.7);text-align:right;line-height:2}
#hint.gone{opacity:0}

#bar{position:absolute;top:0;left:0;height:1.5px;background:var(--silk);width:0;z-index:7;transition:width .3s ease,opacity .5s}

#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;mix-blend-mode:screen}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9}
body.film #console,body.film #hint,body.film #intro,body.film #poiLayer,
body.film #card,body.film #bar{display:none!important}
body.film #viewport{cursor:default}
body.demo #viewport,body.demo .btn,body.demo .chip,body.demo .segBtn,
body.demo .mapWrap,body.demo input[type=range]{cursor:none}
#cur,#cring,#toast{display:none}
body.demo #cur,body.demo #cring,body.demo #toast{display:block}
body.demo #console{zoom:1.45}                 /* 演示模式把控制台放大，观众看得清点了什么 */
body.demo .pressed{background:rgba(201,169,105,.42)!important;color:#fff!important;
  border-color:var(--silk)!important}
#cur{position:fixed;left:0;top:0;width:34px;height:34px;z-index:40;pointer-events:none;
  transform:translate(-200px,-200px);filter:drop-shadow(0 2px 5px rgba(0,0,0,.7))}
#cur svg{width:100%;height:100%;display:block}
#cring{position:fixed;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
  border:2.5px solid rgba(255,238,196,.95);z-index:39;pointer-events:none;opacity:0}
#toast{position:fixed;left:0;top:0;z-index:41;pointer-events:none;font-family:var(--serif);
  font-size:25px;font-weight:500;letter-spacing:.16em;color:#0b0f13;background:var(--silk);
  padding:11px 22px;opacity:0;white-space:nowrap;box-shadow:0 6px 26px rgba(0,0,0,.6)}

.cRow2{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:0 14px 11px;
  border-top:1px solid var(--line-soft);padding-top:11px}
.segBlock{display:flex;align-items:center;gap:9px}
.segLabel{font-family:var(--serif);font-size:11px;letter-spacing:.3em;color:var(--paper-3);white-space:nowrap}
.seg{display:flex;border:1px solid var(--line)}
.segBtn{font-family:var(--serif);font-size:14px;font-weight:500;letter-spacing:.1em;color:var(--paper-2);
  padding:5px 14px;border-right:1px solid var(--line);transition:color .2s,background .2s}
.segBtn:last-child{border-right:0}
.segBtn:hover{color:var(--paper);background:rgba(201,169,105,.08)}
.segBtn.on{color:var(--ink-900);background:var(--silk)}
.wetBlock{display:flex;align-items:center;gap:11px;min-width:0}
.wetName{font-family:var(--serif);font-size:15px;font-weight:500;letter-spacing:.08em;color:var(--azurite);
  width:2.6em;text-align:center;white-space:nowrap}
.wetWrap{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}

@media (max-width:760px){
  .cRow2{grid-template-columns:1fr;gap:10px;padding:10px 12px}
  .segBlock{justify-content:space-between}
  .seg{flex:1;margin-left:10px}
  .segBtn{flex:1;text-align:center;padding:6px 0}

  .cRow{grid-template-columns:1fr;gap:11px;padding:10px 12px}
  .btns{justify-content:space-between;flex-wrap:wrap}
  .mapWrap{height:36px}
  .guide{padding:8px 12px}
  .introBox{gap:15px}
  #card{left:12px;right:12px;bottom:12px;width:auto}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  #plate img,#intro,#card,.poi i,.poi::after{transition:none}
}

    </div>
  </div>
</div>

function interpAt(arr,u){
  if(u<=arr[0][0])return arr[0][1];
  const n=arr.length; if(u>=arr[n-1][0])return arr[n-1][1];
  let lo=0,hi=n-1;
  while(hi-lo>1){const m=(lo+hi)>>1; if(arr[m][0]<=u)lo=m; else hi=m;}
  const a=arr[lo],b=arr[hi],k=(u-a[0])/(b[0]-a[0]);
  return a[1]+(b[1]-a[1])*k;
}

const lanes=LANES.map(pts=>{
  const seg=[];let total=0;
  for(let i=0;i<pts.length-1;i++){
    const dx=pts[i+1][0]-pts[i][0],dy=pts[i+1][1]-pts[i][1];
    const L=Math.hypot(dx,dy*3);        // 纵向按视觉比例加权
    seg.push({x:pts[i][0],y:pts[i][1],dx,dy,L,acc:total});total+=L;
  }
  return {pts,seg,total};
});
function laneAt(ln,d){
  d=((d%ln.total)+ln.total)%ln.total;
  const s=ln.seg;let i=0;
  while(i<s.length-1&&s[i].acc+s[i].L<d)i++;
  const k=(d-s[i].acc)/s[i].L;
  return {u:s[i].x+s[i].dx*k, v:s[i].y+s[i].dy*k, du:s[i].dx};
}

function chanAlpha(data,w,h,ch){                 // 取出一个通道当 alpha，得到一张纯白蒙版
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;
  const c=cv.getContext("2d");
  const id=c.createImageData(w,h),d=id.data;
  for(let i=0,n=w*h;i<n;i++){const o=i*4;d[o]=255;d[o+1]=255;d[o+2]=255;d[o+3]=data[o+ch];}
  c.putImageData(id,0,0);cv.__id=++_aid;return cv;
}
function loadMask(src,cb){

      const c2=cv.getContext("2d",{willReadFrequently:true});
      c2.drawImage(img,0,0);

}

function tinted(src,col){
  const q=v=>Math.round(v/6)*6;

  let c=tintCache.get(key); if(c)return c;
  c=document.createElement("canvas");c.width=src.width;c.height=src.height;
  const x=c.getContext("2d");
  x.drawImage(src,0,0);
  x.globalCompositeOperation="source-in";
  x.fillStyle="rgb("+q(col[0])+","+q(col[1])+","+q(col[2])+")";

                  dx+a*DW,    dy+e*DH,     (b-a)*DW,       (f-e)*DH);

function ensureHi(){

/* ===== 版面 ===== */
function layout(){
  const r=viewport.getBoundingClientRect();
  stageW=Math.max(1,r.width); stageH=Math.max(1,r.height);
  dpr=Math.min(window.devicePixelRatio||1,2);
  fx.width=Math.round(stageW*dpr); fx.height=Math.round(stageH*dpr);
  fx.style.width=stageW+"px"; fx.style.height=stageH+"px";
  scale=(stageH/ART_H)*S.zoom;
  DW=ART_W*scale; DH=ART_H*scale;
  const tw=DW/NT;
  for(let i=0;i<NT;i++){const e=tiles[i].el,g=hi[i].el;
    e.style.width=g.style.width=(tw+1)+"px"; e.style.height=g.style.height=DH+"px";}
  maxX=Math.max(0,DW-stageW); maxY=Math.max(0,DH-stageH);
  offY=DH<stageH?(stageH-DH)/2:0;
  clamp(); ensureTiles(); ensureHi(); applyScroll();
}
function clamp(){
  S.x=Math.max(0,Math.min(maxX,S.x));
  S.y=Math.max(0,Math.min(maxY,S.y));
}
function applyScroll(){
  const tw=DW/NT, ty=offY-S.y;
  baseLayer.style.backgroundSize=DW+"px "+DH+"px";
  baseLayer.style.backgroundPosition=(-S.x)+"px "+ty+"px";
  for(let i=0;i<NT;i++){
    const t=tiles[i],x=i*tw-S.x;
    const g=hi[i];
    if(x>stageW+2||x+tw<-2){
      if(!t.off){t.el.style.visibility="hidden";g.el.style.visibility="hidden";t.off=true;}
      continue;
    }
    if(t.off){t.el.style.visibility="";g.el.style.visibility="";t.off=false;}
    const tr="translate3d("+x+"px,"+ty+"px,0)";
    t.el.style.transform=tr; g.el.style.transform=tr;
  }
  const w=Math.max(1.2,stageW/DW*100);
  mapBox.style.left=(S.x/DW*100)+"%"; mapBox.style.width=w+"%";
}

function lerp(a,b,k){return a+(b-a)*k;}
function lerpC(a,b,k){return [lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k),a.length>3?lerp(a[3],b[3],k):1];}
const rgba=c=>"rgba("+Math.round(c[0])+","+Math.round(c[1])+","+Math.round(c[2])+","+(c[3]!==undefined?c[3].toFixed(3):1)+")";

function grade(){
  const t=S.tod;let i=0;
  while(i<TOD.length-2&&TOD[i+1].at<=t)i++;
  const a=TOD[i],b=TOD[i+1],k=(t-a.at)/(b.at-a.at);
  return {name:(k<.5?a.name:b.name),
    mulT:lerpC(a.mulT,b.mulT,k),mulB:lerpC(a.mulB,b.mulB,k),
    scrT:lerpC(a.scrT,b.scrT,k),scrB:lerpC(a.scrB,b.scrB,k),
    sat:lerp(a.sat,b.sat,k),bri:lerp(a.bri,b.bri,k),mist:lerp(a.mist,b.mist,k),
    glint:lerp(a.glint,b.glint,k),gcol:lerpC(a.gcol,b.gcol,k),smoke:lerp(a.smoke,b.smoke,k),
    lamp:lerp(a.lamp,b.lamp,k),ink:lerpC(a.ink,b.ink,k),sail:lerpC(a.sail,b.sail,k),birds:lerp(a.birds,b.birds,k)};
}
function seasonNow(){

}
function smooth01(v,a,b){const t=Math.max(0,Math.min(1,(v-a)/(b-a)));return t*t*(3-2*t);}
function weather(){

function wetLabel(){

const glints=[];for(let i=0;i<230;i++)glints.push({u:0,v:0,len:0,ph:Math.random(),sp:.3+Math.random()*.5,live:false});
function seedGlint(g){
  for(let i=0;i<20;i++){
    const u=((S.x-DW*.06)+Math.random()*(stageW+DW*.12))/DW*AU;
    const v=Math.random()*AV;
    if(u>=0&&u<=AU&&waterAt(u,v)>.82){
      g.u=u;g.v=v;g.len=5+Math.random()*30;g.ph=0;g.sp=.28+Math.random()*.55;g.live=true;return;
    }
  }
  g.live=false;
}
function drawGlints(c,dt){
  if(!maskOK)return;
  c.globalCompositeOperation="lighter";
  const col=G.gcol, base=G.glint;
  for(const g of glints){
    if(!g.live){if(Math.random()<.4)seedGlint(g);continue;}
    g.ph+=dt*g.sp; g.u+=dt*2.4*windNow;
    if(g.ph>=1){g.live=false;continue;}
    const x=SX(g.u),y=SY(g.v);

    const w=PX(g.len),h=Math.max(1.1,PX(1.05));

  }
  c.globalAlpha=1;c.globalCompositeOperation="source-over";
}
let _tintC=null,_tintKey="";
function tintedGlint(col){
  const q=v=>Math.round(v/8)*8;
  const key=q(col[0])+","+q(col[1])+","+q(col[2]);

const boats=[];
lanes.forEach((ln,li)=>{
  const n=Math.max(3,Math.round(ln.total/210));
  for(let i=0;i<n;i++)boats.push({ln:li,d:ln.total*(i/n)+Math.random()*60,
    sp:(2.6+Math.random()*3.4)*(Math.random()<.5?1:-1),kind:Math.random()<.45?0:1,wob:Math.random()*6.28});
});
function drawBoats(c,dt){
  const inkC=rgba([G.ink[0],G.ink[1],G.ink[2],.86]);
  const inkL=rgba([G.ink[0],G.ink[1],G.ink[2],.62]);
  const sailC=rgba([G.sail[0],G.sail[1],G.sail[2],.72]);
  const shownB=Math.ceil(boats.length*SN.boatFrac);
  for(let bi=0;bi<boats.length;bi++){
    const b=boats[bi]; if(bi>=shownB)continue;
    b.d+=b.sp*dt; b.wob+=dt*1.5;
    const p=laneAt(lanes[b.ln],b.d);
    const x=SX(p.u),y=SY(p.v);
    if(x<-60||x>stageW+60||y<-40||y>stageH+40)continue;
    const depth=Math.max(0,Math.min(1,(p.v-120)/190));
    const s=PX(.62)*(.60+depth*.90);
    if(s<.25)continue;
    const dir=b.sp>=0?1:-1;
    const bob=Math.sin(b.wob)*s*.22;
    // 尾迹
    c.strokeStyle=rgba([255,255,255,.10+G.glint*.10]);c.lineWidth=Math.max(.5,s*.14);
    c.beginPath();c.moveTo(x-dir*s*5,y+bob+s*1.2);c.lineTo(x-dir*s*16,y+bob+s*2.6);
    c.moveTo(x-dir*s*5,y+bob+s*1.2);c.lineTo(x-dir*s*15,y+bob-s*.2);c.stroke();
    c.save();c.translate(x,y+bob);c.scale(dir*s,s);
    c.beginPath();c.moveTo(-6,0);c.quadraticCurveTo(0,3.5,6.2,-.2);c.quadraticCurveTo(0,1.2,-6,0);
    c.fillStyle=inkC;c.fill();
    if(b.kind===0){
      c.beginPath();c.moveTo(.2,-.6);c.lineTo(.2,-8.4);c.lineWidth=.62;c.strokeStyle=inkL;c.stroke();
      c.beginPath();c.moveTo(.9,-8);c.quadraticCurveTo(5.2,-4.6,1.2,-1.4);c.closePath();
      c.fillStyle=sailC;c.fill();
    }else{
      c.beginPath();c.moveTo(-3.2,-.3);c.quadraticCurveTo(0,-4,3.2,-.3);c.closePath();c.fillStyle=inkC;c.fill();
      c.beginPath();c.moveTo(4.8,-.5);c.lineTo(4.6,-3.2);c.lineWidth=.6;c.strokeStyle=inkL;c.stroke();
    }
    c.restore();
    if(G.lamp>.02){
      c.globalCompositeOperation="lighter";c.globalAlpha=G.lamp*.85;
      const r=s*4.2;
      c.drawImage(lampSprite(),x-dir*s*2-r,y+bob-s*1.4-r,r*2,r*2);
      c.globalAlpha=G.lamp*.28;
      c.drawImage(lampSprite(),x-dir*s*2-r*.6,y+bob+s*1.6,r*1.2,r*2.6);
      c.globalAlpha=1;c.globalCompositeOperation="source-over";
    }
  }
}

const drops=[];
/* ===== 雨打江面：溅起、荡开 ===== */
const splashes=[];
let splashCarry=0;
function spawnSplash(dt,pr){
  if(!maskOK)return;
  splashCarry+=dt*pr*pr*230;
  let tries=0;
  while(splashCarry>=1 && splashes.length<300 && tries<90){
    splashCarry-=1;
    for(let k=0;k<5;k++){
      tries++;
      const sx=Math.random()*stageW, sy=Math.random()*stageH;
      const u=(S.x+sx)/DW*AU, v=(S.y-offY+sy)/DH*AV;
      if(u<0||u>AU||v<0||v>AV)continue;
      if(waterAt(u,v)>.75){
        splashes.push({u,v,t:0,life:.34+Math.random()*.30,
          s:(.45+(v/AV)*1.25)*(.8+Math.random()*.5)});
        break;
      }
    }
  }
}
function drawSplashes(c,dt){
  if(!splashes.length)return;
  const col=G.gcol, cr=(col[0]|0)+","+(col[1]|0)+","+(col[2]|0);
  for(let i=splashes.length-1;i>=0;i--){
    const p=splashes[i]; p.t+=dt;
    if(p.t>p.life){splashes.splice(i,1);continue;}
    const k=p.t/p.life, x=SX(p.u), y=SY(p.v);
    if(x<-14||x>stageW+14||y<-14||y>stageH+14)continue;
    const rad=PX((.35+k*2.5)*p.s);
    c.strokeStyle="rgba("+cr+","+((1-k)*(1-k)*.90).toFixed(3)+")";
    c.lineWidth=Math.max(.5,PX(.20)*(1-k*.55));
    c.beginPath();c.ellipse(x,y,rad,rad*.34,0,0,6.2832);c.stroke();
    if(k<.40){                                   // 溅起的一小柱水
      const q=1-k/.40, hh=PX(1.05*p.s)*q, w=Math.max(.7,PX(.16));
      c.fillStyle="rgba("+cr+","+(q*.78).toFixed(3)+")";
      c.fillRect(x-w/2,y-hh,w,hh);
    }
  }
}
const POOL=1650;
const LAY=[                                   // 远 / 中 / 近：视差、大小、速度各不同
  {a:0,    n:760, p:.50, sz:.55, spd:.68, dim:.52},
  {a:760,  n:560, p:1.0, sz:1.0, spd:1.0, dim:.85},
  {a:1320, n:330, p:1.85,sz:1.85,spd:1.55,dim:1.0},
];
function ensureDrops(){
  if(drops.length)return;
  for(let i=0;i<POOL;i++)drops.push({x:Math.random(),y:Math.random(),r:Math.random(),s:Math.random()});
}
const fmod=(v,m)=>((v%m)+m)%m;
function drawLayer(c,dt,L,pr,snowy){
  /* 雨雪的颗数是"每屏多少颗"，可画面面积随窗口变。竖屏 9:16 的面积只有
     横屏的 56%，同样的颗数会挤成近两倍密。按面积归一化，基准 1920×831。*/
  const dens=Math.max(.42,Math.min(1.08,(stageW*stageH)/1595520));
  const cnt=Math.floor(L.n*pr*dens); if(cnt<1)return;
  const col=G.gcol, cr=(col[0]|0)+","+(col[1]|0)+","+(col[2]|0);
  const spanX=stageW*1.3, spanY=stageH*1.25;
  const slant=windNow*(snowy?1.5:1.25)+(snowy?.10:.35);
  const ox=-S.x*L.p, oy=-(S.y-offY)*L.p*.45;   // 视差：各层随画面平移的幅度不同
  if(snowy){
    c.fillStyle="rgba("+cr+","+(.70*L.dim*(.40+pr*.60)).toFixed(3)+")";
    c.beginPath();
    for(let i=L.a;i<L.a+cnt;i++){
      const d=drops[i];
      d.y+=dt*(.040+d.s*.050)*L.spd;
      d.x+=dt*(slant*.030+Math.sin(S.t*.8+d.r*9)*.007)*L.spd;
      if(d.y>1)d.y-=1; if(d.x>1)d.x-=1; if(d.x<0)d.x+=1;
      const x=fmod(d.x*spanX+ox,spanX)-spanX*.115, y=fmod(d.y*spanY+oy,spanY)-spanY*.10;
      const rr=(.85+d.r*2.0)*L.sz*(.72+pr*.55);
      c.moveTo(x+rr,y); c.arc(x,y,rr,0,6.2832);
    }
    c.fill();
  }else{
    c.strokeStyle="rgba("+cr+","+(.34*L.dim*(.42+pr*.58)).toFixed(3)+")";
    c.lineWidth=Math.max(.6,stageH*.0013*L.sz);
    c.beginPath();
    for(let i=L.a;i<L.a+cnt;i++){
      const d=drops[i];
      d.y+=dt*(.70+d.s*.85)*(.55+pr*.75)*L.spd;
      d.x+=dt*slant*.30*L.spd;
      if(d.y>1)d.y-=1; if(d.x>1)d.x-=1; if(d.x<0)d.x+=1;
      const x=fmod(d.x*spanX+ox,spanX)-spanX*.115, y=fmod(d.y*spanY+oy,spanY)-spanY*.10;
      const len=stageH*(.020+d.s*.034)*(.5+pr*.8)*L.sz;
      c.moveTo(x,y); c.lineTo(x-slant*len*.85,y+len);
    }
    c.stroke();
  }
}
function drawPrecipFar(c,dt){                 // 最先画，随即被山陆抹去 → 真的落在山后
  const pr=WX.precip; if(pr<.02)return;
  ensureDrops();
  drawLayer(c,dt,LAY[0],pr,SN.snowy>.5);
  if(A_LAND){
    c.globalCompositeOperation="destination-out";
    drawMaskLayer(c,A_LAND,1);
    c.globalCompositeOperation="source-over";
  }
}
function drawPrecipNear(c,dt){
  const pr=WX.precip; if(pr<.02)return;
  ensureDrops();
  const snowy=SN.snowy>.5;
  drawLayer(c,dt,LAY[1],pr,snowy);
  drawLayer(c,dt,LAY[2],pr,snowy);
  if(!snowy)spawnSplash(dt,pr);
}

/* ===== 雷光 ===== */
let flashTimer=6,flashSeq=null,flashT=0;
function updateFlash(dt){
  const el=$("#flash");
  if(flashSeq){
    flashT+=dt; let a=0,acc=0,done=true;
    for(const st of flashSeq){ if(flashT<acc+st[0]){a=st[1];done=false;break;} acc+=st[0]; }
    el.style.opacity=done?0:a; if(done)flashSeq=null; return;
  }
  if(WX.storm>.03&&!REDUCED){
    flashTimer-=dt*(.4+WX.storm*1.7);
    if(flashTimer<=0){
      flashTimer=3.2+Math.random()*8; flashT=0;
      const pk=.20+WX.storm*.30;
      flashSeq=[[.05,pk],[.06,0],[.09,pk*.6],[.10,0]];
    }
  }else if(el.style.opacity!=="0"){el.style.opacity=0;}
}

/* ===== 惊起 ===== */
function startle(u,v){
  if(flocks.length>9)return;
  flocks.push({u,v:Math.max(20,v-3),n:3+((Math.random()*4)|0),dir:Math.random()<.5?1:-1,
    sp:24+Math.random()*14,ph:0,age:0,rise:1});
}

/* ===== 行人：桥上与山径 ===== */
function resample(pts){                        // Catmull-Rom 加密，免得走出折线拐角
  if(pts.length<3)return pts.map(q=>[q[0],q[1]]);
  const P=i=>pts[Math.max(0,Math.min(pts.length-1,i))], out=[];
  for(let i=0;i<pts.length-1;i++){
    const a=P(i-1),b=P(i),c=P(i+1),d=P(i+2);
    for(let j=0;j<5;j++){
      const t=j/5,t2=t*t,t3=t2*t;
      out.push([.5*(2*b[0]+(-a[0]+c[0])*t+(2*a[0]-5*b[0]+4*c[0]-d[0])*t2+(-a[0]+3*b[0]-3*c[0]+d[0])*t3),
                .5*(2*b[1]+(-a[1]+c[1])*t+(2*a[1]-5*b[1]+4*c[1]-d[1])*t2+(-a[1]+3*b[1]-3*c[1]+d[1])*t3)]);
    }
  }
  out.push([pts[pts.length-1][0],pts[pts.length-1][1]]);
  return out;
}
const walks=WALKS.map((pts,wi)=>{
  const P=resample(pts), seg=[]; let total=0;
  for(let i=0;i<P.length-1;i++){
    const dx=P[i+1][0]-P[i][0],dy=P[i+1][1]-P[i][1];
    const L=Math.hypot(dx,dy*3);
    seg.push({x:P[i][0],y:P[i][1],dx,dy,L,acc:total});total+=L;
  }
  return {pts:P,seg,total,bridge:wi<NBRIDGE};
}).filter(w=>w.total>2);
const walkers=[];
walks.forEach((w,wi)=>{
  const n=w.bridge?3:(w.total>80?2:1);
  for(let i=0;i<n;i++)walkers.push({w:wi,d:w.total*((i+.3)/n),
    sp:1.8+Math.random()*2.2,dir:Math.random()<.5?1:-1,ph:Math.random()*6.28});
});

function drawFigure(c,x,y,h,ph,dir,ink,robe){   // y 是脚底
  if(h<2.6){ c.fillStyle=ink; c.fillRect(x-.5,y-h,1.1,h); return; }
  const hr=h*.115, hy=y-h+hr, sh=y-h+hr*2.15;
  if(h<7.5){                                     // 远处：一竖一点
    c.strokeStyle=ink;c.lineWidth=Math.max(.7,h*.16);c.lineCap="round";
    c.beginPath();c.moveTo(x,y);c.lineTo(x,sh);c.stroke();
    c.fillStyle=ink;c.beginPath();c.arc(x,hy,Math.max(.55,hr*.92),0,6.2832);c.fill();
    return;
  }
  const hem=y-h*.21, sw=h*.082, hw=h*.152, swing=Math.sin(ph);
  c.beginPath();                                 // 袍
  c.moveTo(x-sw,sh);
  c.quadraticCurveTo(x-sw*1.15,(sh+hem)/2,x-hw,hem);
  c.lineTo(x+hw,hem);
  c.quadraticCurveTo(x+sw*1.15,(sh+hem)/2,x+sw,sh);
  c.closePath();
  c.fillStyle=robe;c.fill();
  c.strokeStyle=ink;c.lineWidth=Math.max(.45,h*.032);c.stroke();
  c.lineCap="round";                             // 腿，交替迈步
  c.lineWidth=Math.max(.55,h*.044);
  c.beginPath();
  c.moveTo(x-h*.022,hem);c.lineTo(x-h*.022+swing*h*.082,y);
  c.moveTo(x+h*.022,hem);c.lineTo(x+h*.022-swing*h*.082,y);
  c.stroke();
  c.lineWidth=Math.max(.45,h*.036);              // 摆臂
  c.beginPath();
  c.moveTo(x+dir*sw*.85,sh+h*.04);
  c.lineTo(x+dir*sw*.85+dir*Math.cos(ph)*h*.075,sh+h*.24);
  c.stroke();
  c.fillStyle=ink;c.beginPath();c.arc(x,hy,hr,0,6.2832);c.fill();
}

function drawWalkers(c,dt){
  const inkA=[G.ink[0],G.ink[1],G.ink[2]];
  const robeA=[G.sail[0],G.sail[1],G.sail[2]];
  for(const k of walkers){
    const W=walks[k.w];
    k.d+=k.sp*dt;
    if(k.d>=W.total)k.d-=W.total;                // 单向循环，不再来回弹
    const dd=k.dir>0?k.d:(W.total-k.d);
    const p=laneAt(W,Math.max(0,Math.min(W.total-.001,dd)));
    const x=SX(p.u),y=SY(p.v);
    if(x<-26||x>stageW+26||y<-26||y>stageH+26)continue;
    const margin=Math.min(W.total*.34,10);       // 两端淡入淡出
    const fade=Math.max(0,Math.min(1,Math.min(k.d,W.total-k.d)/margin));
    if(fade<=.02)continue;
    const depth=Math.max(0,Math.min(1,(p.v-120)/190));
    const h=PX(2.3)*(.72+depth*.52);
    if(h<1.1)continue;
    k.ph+=dt*(4.6+k.sp*.5);
    const a=(.86*fade).toFixed(3);
    drawFigure(c,x,y+Math.sin(k.ph*2)*h*.035,h,k.ph,k.dir,
      "rgba("+(inkA[0]|0)+","+(inkA[1]|0)+","+(inkA[2]|0)+","+a+")",
      "rgba("+(robeA[0]|0)+","+(robeA[1]|0)+","+(robeA[2]|0)+","+(.80*fade).toFixed(3)+")");
  }
}

/* ===== 主循环 ===== */
let windNow=.4,last=0;
const FILM=/[?&](film|demo)=1/.test(location.search);
const DEMO=/[?&]demo=1/.test(location.search);
function frame(now){
  if(FILM)return;                       // 电影模式下由外部逐帧推进
  if(!last)last=now;
  let dt=(now-last)/1000; last=now;
  dt=Math.max(0,Math.min(.05,dt));
  step(dt);
  requestAnimationFrame(frame);
}
function step(dt){
  {
    const m=REDUCED&&!FILM?0:1;
  S.t+=dt*m;
  windNow=.34+Math.sin(S.t*.12)*.2+Math.sin(S.t*.047+1.7)*.16;
  windNow*=1+WX.precip*.9;

  SN=seasonNow(); WX=weather();
  const snowTo=(S.mode===2?1:0)*(.08+.56*WX.precip);
  S.snowAcc+=(snowTo-S.snowAcc)*Math.min(1,dt*(snowTo>S.snowAcc?.34:.22));

  if(S.todAuto&&!REDUCED){S.tod=(S.tod+dt/150)%1;}
  if(S.tour&&!S.drag&&!REDUCED){
    S.x+=dt*stageW*.085;
    if(S.x>=maxX){S.x=maxX;setTour(false);}
  }
  if(!S.drag&&Math.abs(S.vx)>.05){
    S.x-=S.vx; S.vx*=Math.pow(.94,dt*60);
    if(S.x<0||S.x>maxX)S.vx=0;
  }
  if(Math.abs(S.zoom-S.zoomTo)>1e-4){          // 缩放缓动，保持画面中心
    const cx=(S.x+stageW/2)/DW, cy=(S.y+stageH/2)/DH;
    S.zoom+=(S.zoomTo-S.zoom)*Math.min(1,dt*6.5);
    if(Math.abs(S.zoom-S.zoomTo)<=1e-4)S.zoom=S.zoomTo;
    layout();
    S.x=cx*DW-stageW/2; S.y=cy*DH-stageH/2;
  }
  clamp(); applyScroll(); ensureTiles(); ensureHi();

  G=grade(); applyGrade();

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,stageW,stageH);
  const fdt=dt*m;
  drawPrecipFar(ctx,fdt);
  drawSeasonWash(ctx);
  drawGlints(ctx,fdt);
  drawRings(ctx,fdt);
  drawSplashes(ctx,fdt);
  drawFalls(ctx);
  drawBoats(ctx,fdt);
  drawSmoke(ctx,fdt);
  drawWalkers(ctx,fdt);
  drawBirds(ctx,fdt);
  drawMist(ctx,fdt);
  drawPrecipNear(ctx,fdt);
  updateFlash(dt);
  placePOIs();
  }
}

let panAnim=null;
function stopPan(){ if(panAnim){cancelAnimationFrame(panAnim);panAnim=null;} }
function panTo(u,v){
  setTour(false);
  const tx=Math.max(0,Math.min(maxX,u/AU*DW-stageW/2));
  const ty=Math.max(0,Math.min(maxY,v/AV*DH-stageH/2));
  const x0=S.x,y0=S.y,t0=performance.now(),dur=REDUCED?0:Math.min(1500,420+Math.abs(tx-x0)*.35);
  if(panAnim)cancelAnimationFrame(panAnim);
  if(dur===0){S.x=tx;S.y=ty;return;}
  (function step(t){
    const k=Math.min(1,(t-t0)/dur),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    S.x=x0+(tx-x0)*e; S.y=y0+(ty-y0)*e;
    if(k<1)panAnim=requestAnimationFrame(step);
  })(t0);
}

/* ===== 交互 ===== */
let px0=0,py0=0,lastMove=0,moved=false;
viewport.addEventListener("pointerdown",e=>{
  if(e.target.closest(".poi")||e.target.closest("#card")||e.target.closest("#openBtn"))return;
  S.drag=true;moved=false;S.vx=0;setTour(false);stopPan();
  px0=e.clientX;py0=e.clientY;lastMove=performance.now();
  viewport.classList.add("dragging");
  try{viewport.setPointerCapture(e.pointerId);}catch(_){}
});
viewport.addEventListener("pointermove",e=>{
  if(!S.drag)return;
  const dx=e.clientX-px0,dy=e.clientY-py0;
  if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
  S.x-=dx; S.y-=dy; clamp();
  const now=performance.now(),dt=Math.max(8,now-lastMove);
  S.vx=dx/dt*16; lastMove=now;
  px0=e.clientX;py0=e.clientY;
  hideIntro();
});
function endDrag(e){
  if(!S.drag)return;
  S.drag=false;viewport.classList.remove("dragging");
  try{viewport.releasePointerCapture(e.pointerId);}catch(_){}
  if(!moved){
    const rc=viewport.getBoundingClientRect();
    const lx=e.clientX-rc.left, ly=e.clientY-rc.top;
    const u=(S.x+lx)/DW*AU, v=(S.y-offY+ly)/DH*AV;
    if(u>=0&&u<=AU&&v>=0&&v<=AV){
      if(waterAt(u,v)>.5){
        addRing(u,v,1);
        for(let k=0;k<2;k++)addRing(u+(Math.random()-.5)*7,v+(Math.random()-.5)*2.2,.7);
        hideIntro();
      }else if(vegAt(u,v)>.30){ startle(u,v); hideIntro(); }
    }
    if(openIdx>=0)closeCard();
  }
}
viewport.addEventListener("pointerup",endDrag);
viewport.addEventListener("pointercancel",endDrag);
viewport.addEventListener("wheel",e=>{
  e.preventDefault();
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  S.x+=d*1.15; S.vx=0; setTour(false); stopPan(); clamp(); hideIntro();

    S.mode=+b.dataset.m;
    if(S.mode===0)S.wet=0;
    else if(S.wet<.32)S.wet=.60;
    hideIntro();
  });
});
$("#wetRange").addEventListener("input",e=>{
  S.wet=(+e.target.value)/1000;
  if(S.mode===0&&S.wet>.30)S.mode=1;
  hideIntro();
});

/* 卷首 */
function hideIntro(){
  const el=$("#intro");
  if(el.classList.contains("gone"))return;
  el.classList.add("gone");
  setTimeout(()=>{el.style.display="none";},950);
  setTimeout(()=>{$("#hint").classList.add("gone");},7000);
}
$("#openBtn").addEventListener("click",()=>{hideIntro();setTour(true);});

/* 启动 */
window.addEventListener("resize",()=>{layout();});
if(window.ResizeObserver)new ResizeObserver(()=>layout()).observe(viewport);
layout();
SN=seasonNow(); WX=weather(); G=grade(); applyGrade();
if(FILM){
  document.body.classList.add(DEMO?"demo":"film");
  if(!DEMO){ const el=$("#intro"); if(el){el.style.display="none";} }
  else { const el=$("#intro"); if(el){el.style.transition="none";} }
  layout();
  window.__film={
    S:S,
    layout:layout,
    step:function(dt){ step(dt); },
    dim:function(v){ $("#dim").style.opacity=v; },
    ready:function(){ return !!(maskOK&&m2OK&&tiles.every(t=>!t.set||t.el.complete)); },
    loadAll:function(){ tiles.forEach(t=>{ if(!t.set){t.set=true;t.el.src=t.src;} }); },
    metrics:function(){ return {DW:DW,DH:DH,stageW:stageW,stageH:stageH,maxX:maxX,maxY:maxY,offY:offY,AU:AU,AV:AV}; },
    setZoom:function(z){ S.zoom=z; layout(); },
    ring:function(u,v,st){ addRing(u,v,st===undefined?1:st); },
    startle:function(u,v){ startle(u,v); },
    waterAt:function(u,v){ return waterAt(u,v); },
    vegAt:function(u,v){ return vegAt(u,v); },
    /* ——— 演示模式：指针、点击波纹、操作提示 ——— */
    cursor:function(x,y){ $("#cur").style.transform="translate("+(x-3)+"px,"+(y-1)+"px)"; },
    clickFx:function(x,y,k){                   // k: 0→1 点击波纹的进度，<0 表示不显示
      const e=$("#cring");
      if(k<0){ e.style.opacity=0; return; }
      e.style.left=x+"px"; e.style.top=y+"px";
      e.style.opacity=(1-k)*(1-k)*0.95;
      e.style.transform="scale("+(0.25+k*1.25).toFixed(3)+")";
    },
    toast:function(txt,x,y,a){
      const e=$("#toast");
      if(a<=0){ e.style.opacity=0; return; }
      if(txt!==null&&e.textContent!==txt)e.textContent=txt;
      e.style.left=x+"px"; e.style.top=y+"px";
      e.style.transform="translate(-50%,-165%)";
      e.style.opacity=a;
    },
    introOpacity:function(v){
      const e=$("#intro");
      if(!e)return;
      if(v<=0){ e.style.display="none"; } else { e.style.display=""; e.style.opacity=v; }
    },
    rect:function(sel){ const e=document.querySelector(sel); if(!e)return null;
      const r=e.getBoundingClientRect();
      return {x:r.x+r.width/2, y:r.y+r.height/2, w:r.width, h:r.height, left:r.x, top:r.y}; },
    click:function(sel){ const e=document.querySelector(sel); if(e)e.click(); },
    press:function(sel,on){ const e=document.querySelector(sel);
      if(e)e.classList.toggle("pressed",!!on); },
    slider:function(sel,val){ const e=document.querySelector(sel); if(!e)return;
      e.value=Math.round(val); e.dispatchEvent(new Event("input",{bubbles:true})); },
    mapDrag:function(frac,phase){             // 在缩略图上真实拖动
      const w=document.querySelector("#mapWrap"), r=w.getBoundingClientRect();
      const cx=r.x+r.width*Math.max(0,Math.min(1,frac)), cy=r.y+r.height/2;
      const opts={bubbles:true,clientX:cx,clientY:cy,pointerId:7,isPrimary:true};
      if(phase==="down")w.dispatchEvent(new PointerEvent("pointerdown",opts));
      else if(phase==="move")w.dispatchEvent(new PointerEvent("pointermove",opts));
      else w.dispatchEvent(new PointerEvent("pointerup",opts));
      return {x:cx,y:cy};
    },
    tap:function(x,y){                        // 在画面上真实点击（走 waterAt / vegAt 判定）
      const v=document.querySelector("#viewport");
      const o={bubbles:true,clientX:x,clientY:y,pointerId:9,isPrimary:true};
      v.dispatchEvent(new PointerEvent("pointerdown",o));
      v.dispatchEvent(new PointerEvent("pointerup",o));
    },
    drag:function(x,y,phase){                 // 在画面上真实拖拽
      const v=document.querySelector("#viewport");
      const o={bubbles:true,clientX:x,clientY:y,pointerId:11,isPrimary:true};
      if(phase==="down")v.dispatchEvent(new PointerEvent("pointerdown",o));
      else if(phase==="move")v.dispatchEvent(new PointerEvent("pointermove",o));
      else v.dispatchEvent(new PointerEvent("pointerup",o));
    }
  };
}else{
  requestAnimationFrame(frame);
}
})();
</script>

</body></html>
