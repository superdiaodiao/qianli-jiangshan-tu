<!doctype html><meta charset="utf8">
<!-- 开发试跑页：在浏览器里跑小程序引擎做视觉调参，不参与小程序打包
     用法：/dev-harness.html?p=luohua 或 ?p=qljst；window.E 是引擎实例 -->
<style>body{margin:0;background:#0b0f13}canvas{display:block}</style>
<canvas id="cv"></canvas>
<script>
window.wx = { createOffscreenCanvas: ({ width, height }) => {
  const c = document.createElement('canvas'); c.width = width || 1; c.height = height || 1; return c; } };

async function loadModule(path, registry) {
  const code = await (await fetch(path + '?v=' + Date.now())).text();
  const module = { exports: {} };
  new Function('module', 'exports', 'require', code)(module, module.exports,
    p => registry[p.replace('./', '')]);
  return module.exports;
}

(async () => {
  const reg = {};
  reg['qljst-geo.js'] = await loadModule('data/qljst-geo.js', reg);
  reg['luohua-geo.js'] = await loadModule('data/luohua-geo.js', reg);
  reg['xiaoxia-geo.js'] = await loadModule('data/xiaoxia-geo.js', reg);
  reg['songfeng-geo.js'] = await loadModule('data/songfeng-geo.js', reg);
  reg['yule-geo.js'] = await loadModule('data/yule-geo.js', reg);
  const { Engine } = await loadModule('core/engine.js', reg);

  const cv = document.getElementById('cv');
  cv.createImage = () => new Image();
  cv.requestAnimationFrame = cb => window.requestAnimationFrame(cb);
  const W = Math.min(innerWidth, 430), H = innerHeight;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const params = new URLSearchParams(location.search);
  const p = params.get('p') || 'luohua';
  const geo = reg[p + '-geo.js'] || reg['luohua-geo.js'];
  const REMOTE = 'https://superdiaodiao.github.io/qianli-jiangshan-tu/';
  const base = params.get('base') || (p === 'qljst' ? REMOTE : REMOTE + p + '/');
  const e = window.E = new Engine({ canvas: cv, dpr: 2, geo, assetBase: base,
    onUI: () => {}, onMap: () => {}, onPoi: i => console.log('poi', i),
    onProgress: () => {}, onFirstTouch: () => {} });
  e.resize(W, H);
  e.startMasks();
  // 浏览器把后台页 rAF 节流到 ~1fps，用兜底步进保证模拟全速（rAF 正常时不重复驱动）
  setInterval(() => { if (performance.now() - e.last > 200) { try { e.step(1 / 30); } catch (_) {} } }, 33);
  let down = false;
  cv.addEventListener('mousedown', ev => { down = true; e.touchStart([{ x: ev.clientX, y: ev.clientY }]); });
  cv.addEventListener('mousemove', ev => { if (down) e.touchMove([{ x: ev.clientX, y: ev.clientY }]); });
  cv.addEventListener('mouseup', () => { down = false; e.touchEnd(); });
})();
</script>
